name: ci
on:
  pull_request:
jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Public-tree denylist
        uses: braininavatgroup/agent-operating-policy/.github/actions/public-tree-check@b8c552c8c595504eb3090042422b0e617c4c726b
        with:
          denylist: ${{ vars.PUBLIC_TREE_DENYLIST }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python -m pip install --quiet pyyaml
      - run: tools/test.sh
