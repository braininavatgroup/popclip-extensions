name: ci
on:
  pull_request:
jobs:
  ci:
    # The check parses scripts and configs; it needs zsh and PyYAML, not
    # Xcode, so it runs on Ubuntu. A GitHub-hosted macOS job runs only when
    # Bradley authorizes that run (BIV-1320, 2026-10-31).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install zsh for the zsh scripts' syntax check
        run: command -v zsh >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zsh)
      - name: Public-tree denylist
        uses: braininavatgroup/agent-operating-policy/.github/actions/public-tree-check@b8c552c8c595504eb3090042422b0e617c4c726b
        with:
          denylist: ${{ vars.PUBLIC_TREE_DENYLIST }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python -m pip install --quiet pyyaml
      - run: tools/test.sh
